<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sell on Vendorfy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/vendor.css" />
</head>
<body class="plain">
  <header class="vbar">
    <a href="index.html" class="logo">vendorfy</a>
    <div class="vbar-right"><a href="shop.html">Back to shop</a></div>
  </header>

  <main class="wrap">
    <section class="panel auth-card">
      <h1>Sell on Vendorfy</h1>
      <p class="muted">Create a store account to list your products and set your own prices.</p>

      <div class="auth-tabs" id="tabs">
        <button class="active" data-mode="login">Log in</button>
        <button data-mode="register">Create store</button>
      </div>

      <form id="form" novalidate>
        <div class="form-grid" style="grid-template-columns:1fr">
          <label class="field register-only" hidden>Store name
            <input name="storeName" maxlength="40" autocomplete="organization" />
          </label>
          <label class="field register-only" hidden>What do you sell?
            <select name="category" id="category"></select>
          </label>
          <label class="field">Email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label class="field">Password <span class="hint" id="pw-hint" hidden>(at least 8 characters)</span>
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
        </div>
        <div class="msg" id="msg"></div>
        <div class="form-actions">
          <button class="btn btn-primary" id="submit" style="width:100%">Log in</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/vendor-login.js"></script>
</body>
</html>
