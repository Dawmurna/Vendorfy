<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | Vendorfy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/vendor.css" />
</head>
<body class="plain">
  <header class="vbar">
    <a href="index.html" class="logo">vendorfy</a>
    <div class="vbar-right"><a href="shop.html">Back to shop</a></div>
  </header>

  <main class="wrap">
    <section class="panel auth-card">
      <h1 id="title">Welcome back</h1>
      <p class="muted" id="subtitle">Log in with your email. We will send you a 6-digit code, so there is no password to remember.</p>

      <div class="notice" id="why" hidden style="margin-top:14px;margin-bottom:0"></div>

      <!-- Step 1: email -->
      <div id="step1">
        <div class="auth-tabs" id="tabs">
          <button class="active" data-mode="login">Log in</button>
          <button data-mode="signup">Create account</button>
        </div>
        <form id="form1" novalidate>
          <div class="form-grid" style="grid-template-columns:1fr">
            <label class="field" id="name-field" hidden>Your name
              <input name="name" maxlength="60" autocomplete="name" placeholder="Ada Obi" />
            </label>
            <label class="field">Email
              <input name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required />
            </label>
          </div>
          <div class="msg" id="msg1"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="send" style="width:100%">Send me a code</button>
          </div>
        </form>
      </div>

      <!-- Step 2: the code -->
      <div id="step2" hidden>
        <p class="muted" style="margin:16px 0 4px">We sent a 6-digit code to <b id="sent-to"></b>. It works for 10 minutes.</p>
        <form id="form2" novalidate>
          <label class="field">Your code
            <input name="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" required />
          </label>
          <div class="dev-box" id="dev-box" hidden></div>
          <div class="msg" id="msg2"></div>
          <div class="form-actions">
            <button class="btn btn-primary" id="verify" style="width:100%">Continue</button>
          </div>
          <div class="steps-row">
            <button type="button" class="link-btn" id="back">Use a different email</button>
            <button type="button" class="link-btn" id="resend" disabled>Send a new code</button>
          </div>
        </form>
      </div>

      <p class="small-print">By continuing you agree to Vendorfy's Terms of Service and Privacy Policy.<br />
        Selling instead? <a href="vendor-login.html">Vendor login</a></p>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
