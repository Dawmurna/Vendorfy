<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Dashboard | Vendorfy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/vendor.css" />
</head>
<body class="plain">
  <header class="vbar">
    <a href="index.html" class="logo">vendorfy</a>
    <div class="vbar-right">
      <span id="store-name" style="font-weight:700"></span>
      <span class="pill" id="status"></span>
      <a href="shop.html">View shop</a>
      <button id="logout" style="color:var(--blue);font-weight:600">Log out</button>
    </div>
  </header>

  <main class="wrap">
    <div class="notice" id="notice" hidden></div>

    <section class="panel" id="form-panel">
      <h2 id="form-title">Add a product</h2>
      <form id="form" novalidate>
        <div class="form-grid">
          <label class="field full">Product name
            <input name="title" maxlength="80" required />
          </label>
          <label class="field">Price (₦)
            <input name="price" inputmode="numeric" placeholder="25000" required />
          </label>
          <label class="field">Old price (₦) <span class="hint">(optional, shows a discount)</span>
            <input name="oldPrice" inputmode="numeric" placeholder="29000" />
          </label>
          <label class="field">Category
            <select name="category" id="category"></select>
          </label>
          <label class="field">Number in stock
            <input name="stock" inputmode="numeric" value="1" required />
          </label>
          <label class="field full">Sizes <span class="hint">(optional, separate with commas, for example S, M, L, XL)</span>
            <input name="sizes" maxlength="80" />
          </label>
          <label class="field full">Description <span class="hint">(optional)</span>
            <textarea name="description" maxlength="1000"></textarea>
          </label>
          <div class="full">
            <label class="field">Pictures <span class="hint">(1 to 5, JPG, PNG or WEBP, up to 3 MB each)</span>
              <input name="images" id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple />
            </label>
            <div class="previews" id="previews"></div>
          </div>
        </div>
        <div class="msg" id="msg"></div>
        <div class="form-actions">
          <button class="btn btn-primary" id="save">Add product</button>
          <button type="button" class="btn btn-plain" id="cancel" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="panel" id="orders-panel">
      <h2>Orders for my products</h2>
      <div id="orders"><p class="muted">Loading...</p></div>
    </section>

    <section class="panel">
      <h2>My products</h2>
      <div id="list"><p class="muted">Loading...</p></div>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/vendor.js"></script>
</body>
</html>
